<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with us</title>
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --ink: #2b2522; --muted: #7a706a; --line: #e7e0d8;
    --brand: #c2571a; --brand-ink: #ffffff; --bot: #f3ede6; --warn-bg: #fff4d6; --warn-ink: #6b4e00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 700; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; display: none; }
  .chat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; overflow-y: auto; min-height: 360px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; margin: 6px 0; white-space: pre-wrap; word-wrap: break-word; }
  .user { margin-left: auto; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
  .bot { background: var(--bot); border-bottom-left-radius: 4px; }
  .error { background: #fde8e8; color: #8a1c1c; }
  .sources { font-size: 12px; color: var(--muted); margin-top: 6px; white-space: normal; }
  details { margin-top: 8px; font-size: 12px; white-space: normal; }
  details pre { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-height: 260px; overflow: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--ink); }
  .chip:hover { border-color: var(--brand); }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font: inherit; background: var(--card); color: var(--ink); }
  input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  button[type=submit] { padding: 0 18px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  .typing { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">S</div>
    <div>
      <h1 id="title">Chat with us</h1>
      <div class="sub">Ask about hours, the menu, catering or our policies.</div>
    </div>
  </header>
  <div class="banner" id="banner">Dry-run mode: no AI call is made. Each reply shows the document sections that were retrieved and the exact prompt that would be sent to Claude.</div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="input" autocomplete="off" maxlength="1000" placeholder="Type your question..." aria-label="Your question">
    <button type="submit" id="send">Send</button>
  </form>
</div>
<script>
const SUGGESTIONS = ["Are you open on Mondays?", "Do you have gluten-free options?", "How much notice do you need for a birthday cake?", "Do you deliver catering?"];
const chat = document.getElementById("chat"), form = document.getElementById("form"), input = document.getElementById("input"), send = document.getElementById("send");
let history = [];

function add(role, text, extra) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  if (extra) div.appendChild(extra);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function sourcesEl(sources) {
  if (!sources || !sources.length) return null;
  const el = document.createElement("div");
  el.className = "sources";
  el.textContent = "Sources: " + sources.map(s => s.section).join(" · ");
  return el;
}

function promptEl(prompt) {
  const d = document.createElement("details");
  const s = document.createElement("summary");
  s.textContent = "Prompt that would be sent (" + prompt.model + ")";
  const pre = document.createElement("pre");
  pre.textContent = "SYSTEM:\n" + prompt.system + "\n\n" + prompt.messages.map(m => m.role.toUpperCase() + ":\n" + m.content).join("\n\n");
  d.append(s, pre);
  return d;
}

async function ask(question) {
  add("user", question);
  input.value = ""; send.disabled = true;
  const typing = add("bot typing", "Typing...");
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: question, history }) });
    const data = await res.json();
    typing.remove();
    if (!res.ok) { add("bot error", data.detail || "Something went wrong. Please try again."); return; }
    if (data.mode === "dry-run") {
      const box = document.createDocumentFragment();
      const src = sourcesEl(data.sources); if (src) box.appendChild(src);
      box.appendChild(promptEl(data.prompt));
      add("bot", data.sources.length ? "Retrieved " + data.sources.length + " section(s) for this question." : "No matching sections found.", box);
    } else {
      add("bot", data.answer, sourcesEl(data.sources));
      history.push({ role: "user", content: question }, { role: "assistant", content: data.answer });
      history = history.slice(-10);
    }
  } catch (e) {
    typing.remove();
    add("bot error", "Couldn't reach the server. Please try again.");
  } finally {
    send.disabled = false; input.focus();
  }
}

form.addEventListener("submit", e => { e.preventDefault(); const q = input.value.trim(); if (q) ask(q); });
SUGGESTIONS.forEach(q => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = q; b.onclick = () => ask(q); document.getElementById("chips").appendChild(b); });

fetch("/api/info").then(r => r.json()).then(info => {
  document.title = "Chat with " + info.business;
  document.getElementById("title").textContent = info.business;
  document.getElementById("logo").textContent = info.business.charAt(0);
  if (info.mode === "dry-run") document.getElementById("banner").style.display = "block";
  add("bot", "Hi! I'm the " + info.business + " assistant. How can I help?");
});
</script>
</body>
</html>
